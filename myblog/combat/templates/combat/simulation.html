{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Damage Simulator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #0f3460;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #e94560;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            background-color: #e94560;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #c63a50;
        }
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: #1a1a2e;
            border-left: 5px solid #e94560;
            border-radius: 5px;
        }
        .result h2 {
            margin-top: 0;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Combat Simulator</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="char_name">Character Name</label>
                <input type="text" id="char_name" name="char_name" value="{{ char_name|default:'Carlotta' }}" required>
            </div>
            <div class="form-group">
                <label for="skill_name">Skill Name (from JSON)</label>
                <input type="text" id="skill_name" name="skill_name" value="{{ skill_name|default:'Art of Violence' }}" required>
            </div>
            <div class="form-group">
                <label for="base_attack">Base Attack</label>
                <input type="number" id="base_attack" name="base_attack" value="{{ base_attack|default:2000 }}" required>
            </div>
            <div class="form-group">
                <label for="enemy_defense">Enemy Defense</label>
                <input type="number" id="enemy_defense" name="enemy_defense" value="{{ enemy_defense|default:1000 }}" required>
            </div>
            <div class="form-group">
                <label for="enemy_res_multi">Enemy Resistance Multiplier (e.g., 0.9 for 10% RES)</label>
                <input type="number" step="0.01" id="enemy_res_multi" name="enemy_res_multi" value="{{ enemy_res_multi|default:0.9 }}" required>
            </div>
            <button type="submit">Run Simulation</button>
        </form>

        {% if result is not None %}
        <div class="result">
            <h2>Simulation Result</h2>
            <p><strong>Character:</strong> {{ char_name }}</p>
            <p><strong>Skill:</strong> {{ skill_name }}</p>
            <p><strong>Calculated Average Damage:</strong> {{ result|floatformat:2 }}</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="result" style="border-left-color: #ffc107;">
            <h2 style="color: #ffc107;">Error</h2>
            <p>{{ error }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
