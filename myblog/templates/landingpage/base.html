<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wuthering Waves Builder{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        .navbar { background-color: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin: 0 10px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .messages { padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .messages .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .messages .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .messages .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        /* Gaya tambahan untuk layout comparison */
        .comparison-section { display: flex; gap: 40px; justify-content: space-around; margin-top: 20px; }
        .stats-column { flex: 1; border: 1px solid #eee; padding: 20px; border-radius: 8px; background-color: #fcfcfc; }
        .stats-block p, .selected-gear p, .ideal-gear p { margin: 5px 0; font-size: 0.95em; }
        .recommendations-section { border: 1px solid #dcdcdc; padding: 20px; border-radius: 8px; background-color: #fffaf0; margin-top: 20px; }
        .recommendations-section ul { list-style-type: disc; margin-left: 20px; padding: 0; }
        .recommendations-section li { margin-bottom: 5px; }
        .priority-stat { font-weight: bold; color: #d9534f; } /* Warna merah untuk penekanan */
        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; cursor: pointer; }
        .btn-primary { background-color: #007bff; border: 1px solid #007bff; }
        .btn-info { background-color: #17a2b8; border: 1px solid #17a2b8; }
        .btn-danger { background-color: #dc3545; border: 1px solid #dc3545; }
        .btn:hover { opacity: 0.9; }
        form div { margin-bottom: 10px; }
        form label { display: block; margin-bottom: 5px; font-weight: bold; }
        form input[type="text"], form input[type="number"], form select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        form button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <a href="/">Home</a>
            <a href="{% url 'build:build_history' %}">My Builds</a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>Hello, {{ user.username }}!</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                {# <a href="{% url 'register' %}">Register</a> #}
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
